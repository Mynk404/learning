<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="calc.css">
    <script src="calc.js"></script>
</head>
<body>
    <h1 style="text-align: center; color: white; text-shadow: 0px 0px 5px rgb(113, 89, 0),0px 0px 5px red;">Calculator</h1>

    <div class="parent">
        <div class="input">
            <input id="input1" type="number" placeholder="number1">
        </div>
        <div class="operations">
            <button onclick="add()">add</button>
            <button onclick="sub()">sub</button>
            <button onclick="mul()">mul</button>
            <button onclick="div()">div</button>

        </div>
        <div class="input">
            <input id="input2" type="number" placeholder="number2">
        </div>

        <div class="result">
            <button onclick="calc()">Calculate</button>
        </div>
        <div id="answer"></div>
        
    </div>
</body>
</html>
